name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/resource/src/**'
      - 'packages/resource/typedoc.json'
      - 'packages/resource-react/src/**'
      - 'packages/resource-react/typedoc.json'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TypeDoc to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --outputStyle=static

      - name: Generate TypeDoc
        run: |
          pnpm nx run @hateoas-ts/resource:docs
          pnpm nx run @hateoas-ts/resource-react:docs

      - name: Prepare combined docs
        run: |
          rm -rf site
          mkdir -p site/resource site/resource-react
          cp -R packages/resource/docs/. site/resource/
          cp -R packages/resource-react/docs/. site/resource-react/
          printf '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=resource/"><title>hateoas-ts docs</title></head><body><p><a href="resource/">@hateoas-ts/resource docs</a></p><p><a href="resource-react/">@hateoas-ts/resource-react docs</a></p></body></html>' > site/index.html
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
